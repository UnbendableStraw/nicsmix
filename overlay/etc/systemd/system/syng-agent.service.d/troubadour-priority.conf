# Troubadour: the cell is a single 1.2 GHz core shared with jackd / syngsoundserver / airplay2source (nice -20).
# At nice 0 the agent's control replies (volume, puck) queued behind everything else and took 150-600 ms.
# Nice -8 puts the agent ahead of cloudsyncd/celldirector/etc. while the audio stack keeps strict priority.
# Reversible: delete this file, systemctl daemon-reload, systemctl restart syng-agent.
[Service]
Nice=-8
