# Troubadour: make a cell with BOTH eth0 and winfra0 on the same LAN subnet behave (the wired-primary design:
# Ethernet to the AirPlay sender, home Wi-Fi + SyFi up as well — Syng's own wpa_supplicant re-joins Wi-Fi at boot).
# Without this Linux answers ARP for either address on either interface ("ARP flux"): the LAN can learn the
# wired IP at the Wi-Fi MAC (and vice versa), AirPlay's PTP timing packets then cross the wrong radio, strict
# rp_filter drops some, and PTP reports "offset is invalid for gm …" → SetRateAndAnchor -71976 → a sender that
# connects but never plays (2026-10-20 14:16 incident, docs/WIRED-REELECTION.md §8).
# Harmless on single-homed cells. Revert: delete this file + `sysctl --system` (or reboot).
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
