<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Syng sound field</title>
<style>
body{margin:0;background:#000;color:#cfe3ea;font:14px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:13px;letter-spacing:.14em;color:#8aa3ad;margin:8px 0 10px;font-weight:600}
h1 b{color:#fff;letter-spacing:0;font-size:16px;margin-left:8px}
#wrap{border-radius:18px;background:#000}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:#7f98a3;font-size:12px;margin:10px 2px}
.ctl{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:6px 0;font-size:12px;color:#9fb4bd}
.ctl input[type=range]{width:100%}
button{background:#122028;color:#cfe3ea;border:1px solid #244;border-radius:10px;padding:8px 12px;font:inherit}
#panel{margin-top:14px;display:none}
#state{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6d8792;margin-top:8px;white-space:pre}
</style></head><body><div id=app>
<h1>ROOM <b>Ball Room</b></h1>
<div id=wrap></div>
<div class=legend><span>◉ drag the puck to move the sound</span><span>• lift the dot to go spatial</span><span>◗ handles aim &amp; widen</span><span>▂ bottom rim = volume</span></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button id=reset>Reset particles</button><button id=center>Center</button><button id=tog>Tweaks</button><button id=mus>Music: on</button></div>
<div id=panel></div>
<div id=state></div>
</div>
<script src="textures.js"></script><script src="field-b20.js"></script>
<script>
// demo audio feed: synthetic "music" (beats + spectrum)
let musicOn=true, t0=performance.now();
function demoViz(){ if(!musicOn) return {energy:0.05,bass:0,spec:new Array(24).fill(0.02)};
  const t=(performance.now()-t0)/1000; const beat=Math.max(0,1-((t*2.1)%1)*2.4); const bar=Math.sin(t*0.5)*0.5+0.5;
  const spec=[]; for(let i=0;i<24;i++){ const f=i/23; spec.push(Math.max(0,Math.min(1,(1-f)*0.5*beat+0.25*Math.pow(1-f,2)+0.18*Math.sin(t*3.1+i*0.9)*bar+0.12*Math.sin(t*7.3+i*2.1)+0.05))); }
  return {energy:0.35+0.45*beat*bar+0.15*Math.sin(t*0.9), bass:beat*0.9, spec}; }
const field=SyngField.create(document.getElementById('wrap'),{viz:demoViz,rings:()=>{const s=field.state;return [[-0.55,-0.5],[0.55,-0.5],[-0.78,0.35],[0.78,0.35],[0,0.9]].map(([x,y])=>[s.C[0]+x*s.R*0.95,s.C[1]+y*s.R*0.95,false]);},post:(p,b)=>console.log('POST',p,JSON.stringify(b)),onChange:b=>{document.getElementById('state').textContent=JSON.stringify(b);}});
window.field=field;
document.getElementById('reset').onclick=()=>field.resetParticles();
document.getElementById('center').onclick=()=>field.center();
document.getElementById('mus').onclick=e=>{musicOn=!musicOn;e.target.textContent='Music: '+(musicOn?'on':'off');};
const panel=document.getElementById('panel');
document.getElementById('tog').onclick=()=>{panel.style.display=panel.style.display==='none'||!panel.style.display?'block':'none';};
const tweaks=[['particles',500,12000,100],['weightSpatial',0.5,2,0.01],['handleRadius',0.3,0.9,0.01],['pulseScale',0.5,6,0.1],['pulseRowsPerSec',10,120,1],['pulseGain',0,4,0.05],['pulseEmitter',0,0.5,0.01],['glowGain',0,2.5,0.05],['grain',0,2,0.05],['flurry',0,3,0.05],['pointScale',0.3,3,0.05],['defaultHalfDeg',20,170,1],['haloGain',0,3,0.05],['pointGain',0,3,0.05]];
for(const [k,lo,hi,stp] of tweaks){ const row=document.createElement('div'); row.className='ctl'; row.innerHTML=`<span>${k}</span><input type=range min=${lo} max=${hi} step=${stp} value=${field.cfg[k]}><span class=v>${field.cfg[k]}</span>`; panel.appendChild(row);
  row.querySelector('input').oninput=e=>{const v=parseFloat(e.target.value); row.querySelector('.v').textContent=v; if(k==='particles')field.setParticles(v); else field.cfg[k]=v;}; }
</script></body></html>
